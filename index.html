<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#555555">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>家計簿</title>
<style>
:root{
  --bg:#f9f0e7; --card:#fff; --head:#555; --nav:#4b4b4b; --seg:#444;
  --text:#3a3a3a; --sub:#9a9a9a; --line:#efe6dc;
  --out:#ef8579; --in:#5b8bbd; --sel:#b8a898; --danger:#e0574a; --green:#6aa84f; --plus:#f0b429;
  --navh:56px;--hh:calc(58px + env(safe-area-inset-top, 0px));--navb:calc(56px + env(safe-area-inset-bottom, 0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  font-size:13.2px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;height:var(--hh);padding-top:env(safe-area-inset-top, 0px);
  display:grid;grid-template-columns:76px 1fr 76px;align-items:center;padding:0 10px}
.hbtn{color:#fff;font-size:15.8px;padding:8px 4px;text-align:left;display:flex;align-items:center}
.hbtn.r{justify-content:flex-end;text-align:right}
.hbtn.on{color:#ffd48a;font-weight:700}
.hbtn svg{width:23px;height:23px}
.htitle{text-align:center;font-weight:700;font-size:15px}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:3px;justify-self:center;width:min(100%,250px)}
.seg button{flex:1;padding:6px 0;border-radius:8px;color:#fff;font-size:14.1px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--text);font-weight:600}
.seg.three{width:min(100%,260px)}

main{padding:12px 12px calc(var(--navb) + 24px);max-width:560px;margin:0 auto}
main.flush{padding:0 0 calc(var(--navb) + 24px)}
main.rep{padding-bottom:calc(var(--navb) + 100px)}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.lbl{font-size:12.3px;font-weight:700;color:#555}
.lbl.out{color:var(--out)} .lbl.in{color:var(--in)} .lbl.move{color:#8a7c70}

/* input */
.date-card{position:relative;padding-bottom:8px}
.date-big{position:relative;text-align:center;font-size:clamp(19.4px,6vw,26.4px);font-weight:700;letter-spacing:.5px;margin:-4px 0 2px}
.date-ov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.date-nav{display:flex;justify-content:space-between;font-size:12.3px}
.date-nav button{padding:4px 2px;color:#b3b3b3}
.date-nav button.today{color:var(--out);font-weight:600}
.row-card{display:flex;align-items:center;gap:14px;min-height:64px}
.row-card .lbl{width:58px;flex:none;align-self:flex-start;padding-top:4px}
.name-in{flex:1;border:0;outline:0;font-size:19px;padding:8px 0;background:transparent;min-width:0}
.name-in::placeholder{color:#c9c9c9}
.amt-card{cursor:pointer}
.amt{font-size:29.9px;font-weight:500;letter-spacing:1px}
.sec-ttl{font-size:12.3px;font-weight:700;color:#666;margin:12px 2px 8px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{background:#fff;border-radius:12px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid transparent}
.cat .ic{font-size:20px;line-height:1}
.cat .nm{font-size:11px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94%}
.cat.on{border-color:var(--sel);background:#fffdfa}
.cat.edit .nm{font-size:13.2px}
.as-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.as-grid .cat{height:76px}
.submit-wrap{position:sticky;bottom:calc(var(--navb) + 8px);padding-top:10px;display:flex;justify-content:center}
.submit{background:#fff;width:min(100%,360px);height:58px;border-radius:14px;font-size:18.5px;font-weight:700;box-shadow:0 2px 10px rgba(120,90,60,.12)}
.submit.out{color:var(--out)} .submit.in{color:var(--in)} .submit.move{color:#7a6c60}

/* pager */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -12px;align-items:flex-start}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 12px;min-width:0;box-sizing:border-box}
.dotsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:12px 0 0;font-size:10.1px;color:#c4b8ad}
.dotsrow .r{text-align:right}
.dots{display:flex;gap:12px;justify-content:center}
.dots button{width:11px;height:11px;border-radius:50%;background:#555}
.dots button.on{background:var(--out)}
.tpl-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tpl{background:#fff;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;text-align:left}
.tpl .ic{font-size:18px}
.tpl .t{font-size:11.9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl .s{font-size:10.6px;color:var(--sub)}
.memo-in{width:100%;min-height:150px;border:0;border-radius:12px;padding:12px;background:#fff;resize:vertical}
.addbtn{width:100%;margin-top:8px;padding:11px;border-radius:10px;border:1.5px dashed #d8cbbd;color:#8a7c70;background:transparent}
.fee-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 14px;margin-top:10px}
.fee-row input{flex:1;border:0;outline:0;text-align:right;font-size:18px;min-width:0;background:transparent}

/* list */
.lband{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--bg);padding:8px 12px;position:sticky;top:var(--hh);z-index:5;border-bottom:1px solid #eadfd3}
.lband .l{font-size:11.4px;font-weight:700;color:#666}
.lband .l b{display:block;color:var(--green);font-size:14.1px;font-weight:600}
.lband .c{text-align:center;font-weight:700;font-size:11.9px;line-height:1.3;display:flex;align-items:center;gap:4px}
.lband .c button{color:#9a8b7e;font-size:15.8px;padding:4px 6px}
.lband .c .y{font-size:14.1px}
.lband .r{text-align:right;font-size:13.2px;font-weight:600}
.lband .r .o{color:var(--out)} .lband .r .i{color:var(--in)}
.sbar{display:flex;gap:8px;padding:8px 12px;background:#f3ebe2}
.sbar input{flex:1;border:1px solid #e3d8cc;border-radius:10px;padding:8px 12px;background:#fff;min-width:0}
.dband{background:#f1f1f3;padding:7px 16px;font-weight:700;font-size:15px;color:#555}
.r2{display:grid;grid-template-columns:40px minmax(0,1.05fr) minmax(0,1fr) auto;align-items:center;gap:6px;padding:9px 12px 9px 6px;background:#fff;border-bottom:1px solid #eee;cursor:pointer}
.r2 .ic{font-size:21px;text-align:center}
.r2 .cn{font-size:11px;color:#666;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r2 .am{font-size:18.5px;color:var(--in);font-weight:500;white-space:nowrap}
.r2 .am.neg{color:var(--out)}
.r2 .nm{font-size:14.1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.r2 .nm small{display:block;font-size:9.7px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r2 .dt{font-size:11.4px;color:#777;white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:12.3px}

/* report */
.pbar{position:fixed;left:0;right:0;bottom:var(--navb);z-index:15;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 10px;border-top:1px solid #eadfd3}
.pbar>button{font-size:14.1px;font-weight:600;color:#555;padding:10px 4px}
.pbar>button:last-child{text-align:right}
.pbar .mid{background:#eee4da;border-radius:999px;padding:6px 22px;display:flex;align-items:center;gap:10px;font-weight:600;color:#555;position:relative}
.pbar .mid svg{width:21px;height:21px;flex:none}
.pbar .mid .t{text-align:center;line-height:1.3;font-size:12.3px}
.pbar .mid .t b{display:block;font-size:14.1px}
.rdots{position:fixed;left:0;right:0;bottom:calc(var(--navb) + 64px);z-index:14;display:flex;justify-content:center;pointer-events:none}
.rdots .dots{pointer-events:auto;background:rgba(249,240,231,.85);padding:6px 10px;border-radius:999px}
.big-left{text-align:center;margin:6px 0 2px;color:#555}
.big-left b{font-size:38.7px;font-weight:500;margin:0 6px;color:var(--text);letter-spacing:.5px}
.big-left.neg b{color:var(--danger)}
.perday{text-align:right;font-size:11.9px;color:#666;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:#fff;border-radius:10px;padding:6px 12px 8px}
.tile .k{font-size:11px;font-weight:700;color:#555}
.tile .v{text-align:right;font-size:19.4px;font-weight:600}
.v.o{color:var(--out)} .v.i{color:var(--in)} .v.g{color:var(--green)} .v.r{color:var(--danger)}
.dd{display:inline-flex;align-items:center;gap:6px;background:#eee4da;border-radius:999px;padding:5px 14px;font-weight:700;font-size:12.3px;color:#555;position:relative}
.dd select{position:absolute;inset:0;opacity:0;width:100%}
.pie-wrap{display:flex;justify-content:center;margin-top:6px}
.bhead{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;text-align:center;font-weight:700;color:#6b8f9a;font-size:14px;padding:2px 4px 8px}
.bud{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.bud .t{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;align-items:center;gap:4px}
.bud .n{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;min-width:0}
.bud .n span:last-child{white-space:normal;line-height:1.2;font-size:13.5px}
.bud .n .ic{font-size:21px}
.bud .t>div:not(.n){text-align:right;font-size:16.5px;font-weight:600;white-space:nowrap}
.bud .s{font-size:13px;color:#6b8f9a;margin-top:5px}
.as-ttl{font-weight:700;color:#6b8f9a;font-size:13.2px;margin:2px 2px 8px}
.asc{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.asc .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;min-width:0}
.asc .nm .ic{font-size:20px}
.asc .nm span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asc .nm .chev{color:#c0b6ac;font-weight:400;font-size:20px;margin-left:-2px}
.adr{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 12px;background:#fff;border-bottom:1px solid #eee;cursor:pointer}
.adr .ic{font-size:20px;text-align:center}
.adr .cn{font-size:11px;color:#888;font-weight:700}
.adr .nm{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adr .r{text-align:right;white-space:nowrap}
.adr .v{font-size:16px;font-weight:600}
.adr .v.p{color:var(--in)} .adr .v.m{color:var(--out)}
.adr .b{font-size:11px;color:#999}
.adr.fut{opacity:.55}
.adsum{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;background:#fff;border-radius:12px;padding:10px 6px;margin-bottom:10px}
.adsum div{font-size:11.5px;color:#888;font-weight:700}
.adsum b{display:block;font-size:16px;color:var(--text);margin-top:2px}
.asc .bal{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;font-weight:700;color:#666;flex-wrap:wrap}
.asc .bal b{font-size:19.4px;font-weight:600;color:var(--text)}
.asc .adj{background:#f3eee8;color:#888;border-radius:999px;padding:3px 10px;font-size:11.4px;font-weight:700}
.asc .nums{font-size:10.6px;font-weight:700;color:#555;min-width:150px}
.asc .nums div{display:flex;justify-content:space-between;gap:8px}
.asc .nums .pi{color:var(--in)} .asc .nums .po{color:var(--out)}
.asc .nums .d{border-top:1px solid #ddd;margin-top:4px;padding-top:4px}
.asc .nums .d b{font-size:16.7px;color:var(--plus)}
.asc .nums .d b.neg{color:var(--danger)}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:12px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
.bars .pair{display:flex;gap:2px;align-items:flex-end;width:100%;justify-content:center;flex:1;min-height:0}
.bars .b{width:38%;border-radius:4px 4px 1px 1px;min-height:2px}
.bars .l{font-size:9.7px;color:#777;margin-top:4px}
.bars .col.cur .l{color:var(--text);font-weight:700}
.legend{display:flex;gap:14px;justify-content:center;font-size:10.6px;color:#777;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.trend-tbl{width:100%;border-collapse:collapse;font-size:11.9px;margin-top:10px}
.trend-tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.trend-tbl td:first-child{text-align:left;color:#666}

/* calendar */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav button{width:44px;height:38px;font-size:15.8px;color:#8a7c70}
.mnav .m{font-size:15.8px;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum div{font-size:10.6px;color:var(--sub)}
.sum b{display:block;font-size:14.1px;color:var(--text);font-weight:600;margin-top:2px}
.sum .o b{color:var(--out)} .sum .i b{color:var(--in)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-radius:14px;overflow:hidden}
.cal .wd{text-align:center;font-size:10.6px;padding:6px 0;color:#888;background:#f6efe7}
.cal .wd.su,.cal .dn.su{color:#e06a5e} .cal .wd.sa,.cal .dn.sa{color:#4a8fd9}
.cal .c{min-height:58px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:3px 2px;cursor:pointer;overflow:hidden}
.cal .c:nth-child(7n+1){border-left:0}
.cal .c.blank{background:#fcfaf7;cursor:default}
.cal .c.sel{background:#fff3ec;box-shadow:inset 0 0 0 2px var(--out)}
.cal .dn{font-size:10.6px;font-weight:600;padding-left:2px}
.cal .c.td .dn{background:var(--head);color:#fff;border-radius:999px;display:inline-block;min-width:20px;text-align:center;padding:0 4px}
.cal .eo,.cal .ei{font-size:8.8px;text-align:right;white-space:nowrap;letter-spacing:-.3px}
.cal .eo{color:var(--out)} .cal .ei{color:var(--in)}
.daybox{margin:12px -12px 0}
.daybox .btn{margin:10px 12px 0;width:calc(100% - 24px)}

.btn{display:block;width:100%;background:var(--head);color:#fff;border-radius:12px;padding:13px;font-weight:600;text-align:center}
.btn.sub{background:#fff;color:var(--text);border:1px solid #e3d8cc}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #f0c9c4}
.btn + .btn{margin-top:8px}

/* settings */
main.set{padding:0 0 calc(var(--navb) + 24px)}
.sgrp{font-size:13.2px;color:#666;padding:28px 16px 8px;background:#f8f4f0;border-bottom:1px solid #e8e2dc}
.srow{display:flex;align-items:center;justify-content:flex-start;width:100%;background:#fff;padding:18px 16px;font-size:15.8px;color:#444;border-bottom:1px solid #e8e2dc;text-align:left}
.srow small{font-size:11.4px;color:var(--sub);margin-left:auto;padding-left:10px;white-space:nowrap}
.srow::after{content:'›';margin-left:10px;color:#c0b6ac;font-size:19.4px;line-height:1}
.srow.danger{color:var(--danger)}
.snote{font-size:11px;color:#888;padding:10px 16px;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
.dot.ok{background:#4caf50} .dot.warn{background:#f0a030}
.set-ttl{font-weight:700;font-size:13.2px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.set-txt{font-size:11.4px;color:#777;margin:0 0 10px}
.cat-row,.rule-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.ic-btn{width:36px;height:36px;border-radius:9px;background:#f7f1ea;font-size:17px;flex:none}
.cat-row input,.rule-row input,.rule-add input{flex:1;min-width:0;border:1px solid #e8ded3;border-radius:8px;padding:7px 9px;background:#fff}
.cat-row input.num{flex:0 0 120px;text-align:right}
.sm{width:34px;height:34px;border-radius:8px;background:#f7f1ea;color:#777;font-size:13.2px;flex:none}
.sm.del{color:var(--danger)}
.sm:disabled{opacity:.3}
select.cs{border:1px solid #e8ded3;border-radius:8px;padding:7px 4px;background:#fff;max-width:46%;font-size:15px}
.rule-add{display:flex;gap:6px;margin-top:8px}
.mini-seg{display:flex;background:#eee4da;border-radius:9px;padding:3px;margin:0 auto 10px;width:200px}
.mini-seg button{flex:1;padding:5px 0;border-radius:7px;font-size:12.3px;color:#7a6c60}
.mini-seg button.on{background:#fff;color:var(--text);font-weight:600}
.mini-seg.l{margin:0;width:150px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);height:var(--navb);display:flex;padding-bottom:env(safe-area-inset-bottom, 0px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9d9d9d;font-size:10.1px}
nav button svg{width:22px;height:22px;flex:none}
nav button.on{color:#fff}

/* sheets */
.ov{position:fixed;inset:0;z-index:50;background:rgba(40,30,20,.35);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.show{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(30px);transition:transform .18s}
.ov.show .sheet{transform:none}
.sheet.full{height:94vh;max-height:94vh;display:flex;flex-direction:column;padding:0}
.sheet.center{border-radius:16px;margin:auto 20px;width:auto;max-width:360px;background:#fff}
.ov.center{align-items:center}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-head b{font-size:14.1px}
.x{width:36px;height:36px;border-radius:50%;background:#fff;font-size:14.1px;color:#777}
.f-lbl{display:block;font-size:11px;color:#888;margin:10px 2px 4px}
.f-in{width:100%;border:1px solid #e3d8cc;border-radius:10px;padding:10px 12px;background:#fff}
.f-row{display:flex;gap:8px}
.f-row>*{flex:1;min-width:0}
.sheet .cat-grid{gap:6px}
.sheet .cat{height:62px}
.sheet .cat .ic{font-size:17px}
.sheet .cat .nm{font-size:10.1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{padding:7px 12px;border-radius:999px;background:#fff;font-size:11.9px;color:#666;white-space:nowrap;border:1.5px solid transparent}
.chip.on{border-color:var(--sel);color:var(--text);font-weight:600}
.foot{display:flex;gap:8px;margin-top:14px}
.foot .btn{margin:0}
.kp-disp{background:#fff;border-radius:12px;padding:10px 14px;text-align:right;margin-bottom:10px}
.kp-expr{font-size:11.4px;color:var(--sub);min-height:18px;word-break:break-all}
.kp-val{font-size:28.2px;font-weight:600}
.kp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

 ['マクドナルド','eatout'],['MCDONALD','eatout'],['スターバックス','eatout'],['STARBUCKS','eatout'],['ドトール','eatout'],['タリーズ','eatout'],['コメダ','eatout'],['すき家','eatout'],['吉野家','eatout'],['松屋','eatout'],['サイゼリヤ','eatout'],['ガスト','eatout'],['スシロー','eatout'],['くら寿司','eatout'],['はま寿司','eatout'],['丸亀製麺','eatout'],['餃子の王将','eatout'],['ミスタードーナツ','eatout'],['モスバーガー','eatout'],['ケンタッキー','eatout'],['UBER EATS','eatout'],['UBEREATS','eatout'],['出前館','eatout'],['ピザ','eatout'],['CAFE','eatout'],['カフェ','eatout'],['レストラン','eatout'],['居酒屋','eatout'],
 ['NETFLIX','fun'],['SPOTIFY','fun'],['AMAZON PRIME','fun'],['プライム会費','fun'],['DISNEY','fun'],['U-NEXT','fun'],['YOUTUBE','fun'],['HULU','fun'],['ABEMA','fun'],['DAZN','fun'],['NINTENDO','fun'],['任天堂','fun'],['PLAYSTATION','fun'],['STEAM','fun'],['TOHOシネマズ','fun'],['映画','fun'],['シネマ','fun'],['チケット','fun'],['カラオケ','fun'],['BOOTH','fun'],['PIXIV','fun'],

 const d=defaultSettings(); if(!s||typeof s!=='object')return d;

function budgetTotal(){let s=0;const ids=new Set(catsOf('out').map(c=>c.id));for(const k in S.settings.budgets)if(ids.has(k))s+=+S.settings.budgets[k]||0;return s;}
function classify(desc){
 const n=norm(desc), outIds=new Set(catsOf('out').map(c=>c.id));
 for(const r of S.settings.rules){if(outIds.has(r.cat)&&n.includes(norm(r.kw)))return r.cat;}
 for(const [k,c] of DEF_RULES){if(outIds.has(c)&&n.includes(k))return c;}
 return outIds.has('daily')?'daily':catsOf('out')[0].id;
}
/* asset balances: cumulative up to `end` */
function assetStats(end){
 const st={};const g=n=>st[n]||(st[n]={inc:0,out:0});
 for(const ym in S.months){if(ym>end.slice(0,7))continue;for(const t of S.months[ym]){if(t.date>end)continue;
  if(t.type==='out'&&t.acct)g(t.acct).out+=t.amount;
  else if(t.type==='in'&&t.acct)g(t.acct).inc+=t.amount;
  else if(t.type==='move'){if(t.from)g(t.from).out+=t.amount+(t.fee||0);if(t.to)g(t.to).inc+=t.amount;}
  else if(t.type==='adj'&&t.acct){if(t.amount>=0)g(t.acct).inc+=t.amount;else g(t.acct).out+=-t.amount;}
 }}
 return st;
}

const LSK='kakeibo-v1';
const Store={
 mode:'pending', loaded:false, col:null, pending:new Set(), w:{}, status:'接続中…', ok:false,
 async init(){
  if(STANDALONE){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}this.toLocal();backupReminder();return;}
  let db=null,user=null,uid=null;
  try{
   if(window.claude&&typeof window.claude.use==='function'){
    [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(user)uid=await user.id();
   }
  }catch(e){}
  if(!db||!uid){this.toLocal();return;}
  try{this.col=db.collection('data/users/'+uid);this.db=db;}catch(e){this.toLocal();return;}
  this.mode='cloud';
  this.timer=setTimeout(()=>{if(!this.loaded){this.status='保存先に接続できません。再接続を待っています…';refresh();}},10000);
  this.col.onSnapshot(s=>this.onSnap(s),e=>{clearTimeout(this.timer);this.status='同期が止まりました。ページを開き直してください';this.ok=false;refresh();});
 },
 mergeLocalInto(remote){ // 読み込み前に入力した分を失わない
  const changed=[];
  for(const ym in S.months){
   const r=remote[ym]||[], ids=new Set(r.map(t=>t.id));
   const extra=S.months[ym].filter(t=>!ids.has(t.id));
   if(extra.length){remote[ym]=r.concat(extra);changed.push(ym);}
  }
  return changed;
 },
 onSnap(snap){
  clearTimeout(this.timer);
  const rm={};let rs=null;
  for(const d of snap.docs){const data=d.data();if(!data)continue;
   if(d.id==='settings')rs=clone(data);
   else if(d.id.startsWith('m-'))rm[d.id.slice(2)]=Array.isArray(data.items)?clone(data.items):[];}
  if(!this.loaded){
   this.loaded=true;
   this.mergeLocalInto(rm).forEach(ym=>this.pending.add('m-'+ym));
   S.months=rm;
   if(!this.pending.has('settings'))S.settings=normalizeSettings(rs);
   const p=[...this.pending];this.pending.clear();p.forEach(id=>this.save(id));setTimeout(checkInbox,300);
  }else{
   for(const ym in rm)if(!this.busy('m-'+ym))S.months[ym]=rm[ym];
   for(const ym of Object.keys(S.months))if(!(ym in rm)&&!this.busy('m-'+ym))delete S.months[ym];
   if(!this.busy('settings'))S.settings=normalizeSettings(rs);
  }
  this.ok=!(snap.metadata&&snap.metadata.fromCache);
  this.status=this.ok?'クラウドに保存中（スマホ・PCどこから開いても同じデータ）':'同期中…';
  refresh();
 },
 toLocal(){
  this.mode='local';this.loaded=true;
  let saved=null;try{saved=JSON.parse(localStorage.getItem(LSK)||'null');}catch(e){}
  if(saved){const rm=saved.months||{};this.mergeLocalInto(rm);S.months=rm;S.settings=normalizeSettings(saved.settings);}
  this.saveLocal();
  refresh();
 },
 saveLocal(){
  try{localStorage.setItem(LSK,JSON.stringify({months:S.months,settings:S.settings}));this.status=STANDALONE?'このスマホに保存中':'このブラウザに保存中（ほかの端末とは共有されません）';this.ok=false;}
  catch(e){this.status='保存できない環境です（ページを閉じると消えます）';this.ok=false;}
 },
 save(id){
  if(this.mode==='local'){this.saveLocal();return;}
  if(this.mode!=='cloud'||!this.loaded){this.pending.add(id);return;}
  const w=this.w[id]||(this.w[id]={busy:false,dirty:false});
  w.dirty=true;if(!w.busy)this.run(id,w);
 },
 busy(id){const w=this.w[id];return !!(w&&(w.busy||w.dirty));},
 async run(id,w){
  w.busy=true;
  while(w.dirty){
   w.dirty=false;
   const ref=this.col.doc(id);
   const isM=id!=='settings', ym=id.slice(2);
   let tries=0;
   for(;;){
    try{
     if(isM&&!(S.months[ym]&&S.months[ym].length)){delete S.months[ym];await ref.delete();}
     else await ref.set(isM?{items:clone(S.months[ym])}:clone(S.settings));
     break;
    }catch(e){
     if(e&&e.code==='unavailable'&&tries++<1){await sleep(400+Math.random()*900);continue;}
     this.writeFailed(e);w.dirty=false;break;
    }
   }
  }
  w.busy=false;
 },
 writeFailed(e){
  const c=e&&e.code;
  if(c==='quota_exceeded'){toast('保存容量がいっぱいです。古い記録を削除してください');return;}
  toast('クラウドに保存できなかったため、このブラウザに保存します');
  this.mode='local';this.saveLocal();refresh();
 }
};

/* pager */
function pager(id,pages,edgeLabels){
 const n=pages.length,i=Math.min(S.page[id]||0,n-1);
 return `<div class="pager" data-pager="${id}">${pages.map(p=>`<section class="page">${p}</section>`).join('')}</div>
 ${id==='report'?'':`<div class="dotsrow"><span class="pl">${edgeLabels&&i===0?'最初のページ':''}</span>${dotsHtml(id,n,i)}<span class="r pr">${edgeLabels&&i===n-1?'最後のページ':''}</span></div>`}`;
}
function dotsHtml(id,n,i){return `<div class="dots" data-dots="${id}">${[...Array(n)].map((_,k)=>`<button data-act="dot" data-id="${id}" data-i="${k}" class="${k===i?'on':''}" aria-label="${k+1}ページ目"></button>`).join('')}</div>`;}
function restorePagers(){$$('[data-pager]').forEach(p=>{const i=S.page[p.dataset.pager]||0;p.scrollLeft=i*p.clientWidth;});}
const snapT={};
function snapPager(p){const w=p.clientWidth;if(!w)return;const i=Math.round(p.scrollLeft/w);if(Math.abs(p.scrollLeft-i*w)>2)p.scrollTo({left:i*w,behavior:'smooth'});}
document.addEventListener('touchend',e=>{const p=e.target.closest&&e.target.closest('[data-pager]');if(p){clearTimeout(snapT[p.dataset.pager]);snapT[p.dataset.pager]=setTimeout(()=>snapPager(p),180);}},{passive:true});
document.addEventListener('scroll',e=>{
 const p=e.target;if(!p||!p.dataset||!p.dataset.pager)return;
 clearTimeout(snapT[p.dataset.pager]);snapT[p.dataset.pager]=setTimeout(()=>snapPager(p),180);
 const id=p.dataset.pager,i=Math.round(p.scrollLeft/Math.max(1,p.clientWidth));
 if(S.page[id]===i)return;S.page[id]=i;
 $$(`[data-dots="${id}"] button`).forEach((b,k)=>b.classList.toggle('on',k===i));
 const n=p.children.length,row=p.nextElementSibling;
 if(row&&row.classList.contains('dotsrow')){$('.pl',row).textContent=i===0?'最初のページ':'';$('.pr',row).textContent=i===n-1?'最後のページ':'';}
},true);

function openKeypad(target='amount'){

 const calc=()=>{const parts=expr.match(/[+−]?\d+/g)||[];return parts.reduce((a,p)=>a+(p[0]==='−'?-1:1)*Number(p.replace(/[+−]/,'')),0);};
 const upd=()=>{$('.kp-expr',ov).textContent=/[+−]/.test(expr)?expr:'';$('.kp-val',ov).textContent=yen(Math.max(0,calc()));};

  const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
  if(k==='OK'){S[target]=Math.max(0,calc());ov.close();render();return;}
  if(k==='C')expr='';
  else if(k==='⌫')expr=expr.slice(0,-1);
  else if(k==='+'||k==='−'){if(!expr)return;if(/[+−]$/.test(expr))expr=expr.slice(0,-1);expr+=k;}
  else{const last=(expr.match(/\d*$/)||[''])[0];if(last.length>=9)return;if(last==='0'||last==='')expr=expr.slice(0,expr.length-last.length)+String(Number(last+k)||'');else expr+=k;}
  upd();
 });
}

function assetFlows(name){
 const rows=[];
 for(const ym in S.months)for(const t of S.months[ym]){
  let v=0;
  if(t.type==='out'&&t.acct===name)v=-t.amount;
  else if(t.type==='in'&&t.acct===name)v=t.amount;
  else if(t.type==='move'){if(t.from===name)v-=t.amount+(t.fee||0);if(t.to===name)v+=t.amount;}
  else if(t.type==='adj'&&t.acct===name)v=t.amount;
  if(v)rows.push({t,v});
 }
 rows.sort((a,b)=>a.t.date.localeCompare(b.t.date)||(a.t.ts||0)-(b.t.ts||0));
 let bal=0;for(const r of rows){bal+=r.v;r.bal=bal;}
 return rows;
}

function decodeBuf(buf){
 let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){try{txt=new TextDecoder('shift_jis').decode(buf);}catch(e2){txt=new TextDecoder('utf-8').decode(buf);}}
 return txt.replace(/^﻿/,'');
}
function parseTable(text){
 const first=text.split(/\r?\n/).find(l=>l.trim())||'';
 const delim=(first.split('\t').length>first.split(',').length)?'\t':',';
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true;

  if(!order.includes(name))order.push(name);
  const kind=(r[I.t]||'').trim(),cat=(r[I.c]||'').trim(),bal=parseAmt(r[I.b]);
  if((r[I.it]||'').trim()==='初期残高'||kind==='-'){if(!isNaN(bal)&&bal)adjs.push({name,date:null,amt:bal,item:'初期残高'});prev[name]=isNaN(bal)?0:bal;continue;}
  const date=parseDate(r[I.d]),amt=parseAmt(r[I.a]);
  if(date&&!isNaN(amt)){
   if(kind==='振替'){
    if(/入金/.test(cat))recvs.push({name,date,amt:Math.abs(amt),item:(r[I.it]||'').trim(),used:false});
    else if(/送金/.test(cat))sends.push({name,date,amt:Math.abs(amt),item:(r[I.it]||'').trim(),fee:0});
    else if(/手数料/.test(cat)){const fee=isNaN(bal)||prev[name]===undefined?0:prev[name]-bal;
     const s=[...sends].reverse().find(s=>s.name===name&&s.date===date);if(s&&fee>0)s.fee+=fee;else if(fee)adjs.push({name,date,amt:-fee,item:'振替手数料'});}
   }else if(kind==='資産調整')adjs.push({name,date,amt,item:(r[I.it]||'').trim(),memo:(r[I.memo]||'').trim()});
  }
  if(!isNaN(bal))prev[name]=bal;
 }
 const firstDate=[...sends,...recvs,...adjs].map(x=>x.date).filter(Boolean).sort()[0]||todayStr();
 const items=[];
 for(const s of sends){const r=recvs.find(r=>!r.used&&r.date===s.date&&r.amt===s.amt&&r.name!==s.name);if(r)r.used=true;
  items.push({type:'move',date:s.date,from:s.name,to:r?r.name:'',amount:s.amt,fee:s.fee,name:s.item||(r&&r.item)||''});}
 for(const r of recvs)if(!r.used)items.push({type:'move',date:r.date,from:'',to:r.name,amount:r.amt,fee:0,name:r.item||''});
 for(const a of adjs)items.push({type:'adj',date:a.date||firstDate,acct:a.name,amount:a.amt,name:a.item||'資産調整',memo:a.memo||''});
 const existing=new Set();for(const t of allItems())if(t.src==='migrate'&&t.key)existing.add(t.key);
 const seen={},outItems=[];let dup=0;
 for(const x of items){const base=x.type==='move'?`mv|${x.date}|${x.from}|${x.to}|${x.amount}|${x.fee}`:`adj|${x.date}|${x.acct}|${x.amount}`;
  seen[base]=(seen[base]||0)+1;x.key=base+'#'+seen[base];if(existing.has(x.key)){dup++;continue;}outItems.push(x);}
 return {order,items:outItems,dup};
}
async function unzipTexts(buf){
 const u8=new Uint8Array(buf),dv=new DataView(buf);let e=-1;
 for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
 if(e<0)throw new Error('not zip');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
 for(let k=0;k<n;k++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  const name=decodeBuf(u8.slice(p+46,p+46+nl));p+=46+nl+xl+cl;
  if(/\/$/.test(name)||/__MACOSX|(^|\/)\._/.test(name))continue;
  const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);const data=u8.slice(start,start+csize);
  let raw;
  if(method===0)raw=data;
  else if(method===8){const ds=new DecompressionStream('deflate-raw');raw=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer());}
  else continue;
  out.push({name,text:decodeBuf(raw)});
 }
 return out;
}


/* ---------- backup / restore ---------- */
function lastBackupLabel(){try{const v=localStorage.getItem('kakeibo-lastBackup');if(!v)return '未保存';const d=new Date(+v);return `最終 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;}catch(e){return '';}}
async function saveFile(name,text,mime){
 if(!STANDALONE){
  let dl=null;try{dl=await window.claude?.use?.('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:name,data:text});return 'saved';}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return 'cancel';}}
  return 'fail';
 }
 const file=new File([text],name,{type:mime});
 if(navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file]});return 'saved';}catch(e){if(e&&e.name==='AbortError')return 'cancel';}
 }
 try{const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);return 'saved';}catch(e){return 'fail';}
}
async function saveBackup(){
 const n=allItems().length;
 const ok=await ask(`${n}件の記録と、カテゴリ・資産・予算・テンプレートを1つのファイルに保存します。\n次の画面で「"ファイル"に保存」を選んで、iCloud Drive に保存してください。`,'保存する');
 if(!ok)return;
 const json=JSON.stringify({app:'kakeibo',version:1,exportedAt:new Date().toISOString(),months:S.months,settings:S.settings});
 const name=`家計簿バックアップ_${todayStr().replace(/-/g,'')}.json`;
 const r=await saveFile(name,json,'application/json');
 if(r==='saved'){try{localStorage.setItem('kakeibo-lastBackup',String(Date.now()));}catch(e){}toast('バックアップを保存しました');render();}
 else if(r==='fail')toast('保存できませんでした');
}
function restoreBackup(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
  let d;try{d=JSON.parse(decodeBuf(await f.arrayBuffer()));}catch(e){return toast('バックアップファイルを読めませんでした');}
  if(!d||d.app!=='kakeibo'||!d.months)return toast('家計簿のバックアップファイルではありません');
  const n=Object.values(d.months).reduce((a,v)=>a+(Array.isArray(v)?v.length:0),0);
  const when=d.exportedAt?new Date(d.exportedAt):null;
  if(!await ask(`${when?`${when.getFullYear()}/${when.getMonth()+1}/${when.getDate()} に保存した`:''}バックアップ（${n}件）で、今のデータを置き換えます。よろしいですか？`,'復元する',true))return;
  const months={};for(const k in d.months)if(/^\d{4}-\d{2}$/.test(k)&&Array.isArray(d.months[k]))months[k]=d.months[k];
  S.months=months;S.settings=normalizeSettings(d.settings);Store.saveLocal();
  try{localStorage.setItem('kakeibo-lastBackup',String(Date.now()));}catch(e){}
  S.tab='list';S.listYm=ymOf(todayStr());setHash();render();toast(`${n}件を復元しました`);
 };
 inp.click();
}
function backupReminder(){
 try{
  if(!allItems().length)return;
  const last=+localStorage.getItem('kakeibo-lastBackup')||0,shown=localStorage.getItem('kakeibo-remindDay');
  if(Date.now()-last<30*864e5||shown===todayStr())return;
  localStorage.setItem('kakeibo-remindDay',todayStr());
  setTimeout(()=>toast('そろそろバックアップを保存しましょう（設定 → バックアップを保存）'),1200);
 }catch(e){}
}

/* ---------- export ---------- */
async function exportCsv(){
 const items=allItems().slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
 if(!items.length)return toast('書き出す記録がありません');
 const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
 const csv='日付,種別,カテゴリ,項目名,金額,資産,振替先,手数料,メモ\n'+items.map(t=>{
  const kind={out:'支出',in:'収入',move:'振替',adj:'資産調整'}[t.type];
  const cat=t.type==='out'||t.type==='in'?catOf(t.type,t.cat).name:kind;
  return [t.date,kind,cat,t.name,t.amount,t.type==='move'?t.from:t.acct,t.type==='move'?t.to:'',t.fee||'',t.memo||''].map(q).join(',');}).join('\n');
 {const r=await saveFile(`家計簿_${todayStr().replace(/-/g,'')}.csv`,'\uFEFF'+csv,'text/csv');if(r==='saved'){toast('書き出しました');return;}if(r==='cancel')return;}
 const ov=openSheet(`<div class="sh-head"><b>CSV（コピーして保存できます）</b><button class="x" data-x>✕</button></div><pre class="csv">${esc(csv)}</pre><button class="btn" data-cp style="margin-top:10px">コピー</button>`);
 ov.addEventListener('click',async e=>{if(e.target.closest('[data-x]'))ov.close();if(e.target.closest('[data-cp]')){try{await navigator.clipboard.writeText(csv);toast('コピーしました');}catch(err){toast('コピーできませんでした。長押しで選択してください');}}});
}

/* ---------- events ---------- */
function setHash(){try{if(location.hash!=='#'+S.tab)history.replaceState(null,'','#'+S.tab);}catch(e){}}
function go(tab){S.tab=tab;setHash();render();window.scrollTo(0,0);}
function setLastAcct(n){S.acct=n;try{localStorage.setItem('kakeibo-lastAcct',n);}catch(e){}}
const ACT={
 tab:el=>go(el.dataset.t),
 mode:el=>{S.mode=el.dataset.m;render();},
 moveMode:()=>{S.mode=S.mode==='move'?'out':'move';render();},
 guide:()=>guide(),
 import:()=>openImport(),
 day:el=>{S.date=addDays(S.date,+el.dataset.d);render();},
 today:()=>{S.date=todayStr();render();},
 keypad:()=>openKeypad('amount'),
 dot:el=>{const p=$(`[data-pager="${el.dataset.id}"]`);if(p)p.scrollTo({left:+el.dataset.i*p.clientWidth,behavior:'smooth'});},
 pickCat:el=>{S.cat[S.mode]=el.dataset.id;$$('#main .cat[data-act="pickCat"]').forEach(b=>b.classList.toggle('on',b===el));},
 pickAcct:el=>{setLastAcct(el.dataset.n);$$('#main .cat[data-act="pickAcct"]').forEach(b=>b.classList.toggle('on',b===el));},
 pickFrom:el=>{S.from=el.dataset.n;render();},
 pickTo:el=>{S.to=el.dataset.n;render();},
 submit:()=>{
  if(!S.amount){toast('金額を入力してください');openKeypad('amount');return;}
  let t;
  if(S.mode==='move'){
   if(!S.from||!S.to||S.from===S.to)return toast('出金元と入金先を別々に選んでください');
   t={id:newId(),type:'move',date:S.date,name:S.name.trim(),amount:S.amount,from:S.from,to:S.to,fee:S.fee||0,src:'manual',ts:Date.now()};
   addTxs([t]);S.name='';S.amount=0;S.fee=0;render();toast(`振替 ${yen(t.amount)}（${t.from} → ${t.to}）を記録しました`);return;
  }
  t={id:newId(),type:S.mode,date:S.date,name:S.name.trim(),amount:S.amount,cat:selCat(),acct:curAcct(),memo:S.memo.trim(),src:'manual',ts:Date.now()};
  addTxs([t]);S.name='';S.amount=0;S.memo='';render();
  toast(`${catOf(t.type,t.cat).name} ${yen(t.amount)} を記録しました`);
 },
 lt:el=>{S.listType=el.dataset.t;render();},
 lm:el=>{S.listYm=addMonths(S.listYm,+el.dataset.d);render();},
 search:()=>{S.searchOn=!S.searchOn;if(!S.searchOn)S.q='';render();if(S.searchOn)setTimeout(()=>$('#qIn')&&$('#qIn').focus(),30);},
 editTx:el=>openEdit(el.dataset.id),
 rmode:el=>{S.repMode=el.dataset.m;render();},
 rper:el=>{const d=+el.dataset.d;if(S.repMode==='year')S.repYear=String(+S.repYear+d);else S.repYm=addMonths(S.repYm,d);render();},
 rgo:el=>{S.repMode='month';S.repYm=el.dataset.ym;S.repYear=el.dataset.ym.slice(0,4);render();},
 adjust:el=>openAdjust(el.dataset.n),
 assetDetail:el=>openAssetDetail(el.dataset.n),
 openBudget:()=>openBudget(),openTpls:()=>openTpls(),openCats:()=>openCats(),openAssets:()=>openAssets(),openRules:()=>openRules(),
 cm:el=>{S.calYm=addMonths(S.calYm,+el.dataset.d);render();},
 cd:el=>{S.calSel=el.dataset.d;render();},
 calInput:()=>{S.date=S.calSel;if(S.mode==='move')S.mode='out';go('input');},
 export:()=>exportCsv(),
 backup:()=>saveBackup(),
 restore:()=>restoreBackup(),
 clearAll:async()=>{
  if(!await ask('すべての記録を削除します。元に戻せません。\n（カテゴリ・資産・予算・テンプレートは残ります）','すべて削除',true))return;
  const yms=Object.keys(S.months);S.months={};yms.forEach(ym=>Store.save('m-'+ym));render();toast('削除しました');
 }
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.closest('.ov'))return;
 const f=ACT[el.dataset.act];if(f)f(el,e);
});
let qT;
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.inp;if(!k)return;
 if(k==='name')S.name=e.target.value;else if(k==='memo')S.memo=e.target.value;else if(k==='fee')S.fee=Math.max(0,numIn(e.target.value));
 else if(k==='q'){S.q=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=e.target.selectionStart;render();const q=$('#qIn');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}},250);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&(e.target.dataset.inp==='name'||e.target.dataset.inp==='q')&&!e.isComposing)e.target.blur();});
document.addEventListener('change',e=>{
 const t=e.target,k=t.dataset&&t.dataset.chg;if(!k||t.closest('.ov'))return;
 if(k==='date'){if(t.value){S.date=t.value;render();}}
 else if(k==='pie'){S.pieKind=t.value;render();}
 else if(k==='repYm'){if(t.value){S.repYm=t.value;render();}}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(needRender&&!editing()){needRender=false;render();}},0));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h)&&h!==S.tab){S.tab=h;render();}});
window.addEventListener('resize',()=>restorePagers());

/* ---------- boot ---------- */
(()=>{const h=location.hash.slice(1);if(TABS.includes(h))S.tab=h;})();
render();
Store.init();
</script>
